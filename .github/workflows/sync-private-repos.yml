name: Sync private repositories

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect private repository details
        run: node scripts/sync-private-repos.mjs
        env:
          PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
          PORTFOLIO_AUTHOR_EMAILS: ${{ secrets.PORTFOLIO_AUTHOR_EMAILS }}

      - name: Commit updated data
        run: |
          if git diff --quiet -- assets/data/private-repos.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add assets/data/private-repos.json
          git commit -m "Sync private repository data"
          git push
